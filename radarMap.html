  <script>
    var regionName = "";

    var popMsg = "클립보드에 복사되었습니다.";

    var today = new Date();
    var today_year = today.getFullYear();
    var today_month = dateReturn(today.getMonth() + 1);
    var today_day = dateReturn(today.getDate());
    var today_num = Number("" + today_year + today_month + today_day);
    var today_str = today_year + "-" + today_month + "-" + today_day;

    var ago_days = 30 //최근 30일 동안의 방문자 수만 합침
    var days_ago_raw = today.setDate(today.getDate() - ago_days)
    var days_ago = new Date(days_ago_raw)
    var days_ago_year = days_ago.getFullYear();
    var days_ago_month = dateReturn(days_ago.getMonth() + 1);
    var days_ago_day = dateReturn(days_ago.getDate());
    var days_ago_num = Number("" + days_ago_year + days_ago_month + days_ago_day);

    var ago_years = 2 //최근 2년간의 실거래가만으로 필터링 함
    var years_ago_raw = today.setFullYear(today.getFullYear() - ago_years)
    years_ago_raw = today.setDate(1)
    var years_ago = new Date(years_ago_raw)
    var years_ago_year = years_ago.getFullYear();
    var years_ago_month = dateReturn(years_ago.getMonth() + 2);
    var years_ago_day = dateReturn(years_ago.getDate());
    var years_ago_num = Number("" + years_ago_year + years_ago_month + years_ago_day);

    var origin_x = 0
    var origin_y = 0
    var origin_yx
    login_status = true

    var selectedSubRegion = ""

    function dateReturn(n) {
      return n < 10 ? "0" + n : n;
    }

    window.addEventListener('DOMContentLoaded', () => {
      const raw = sessionStorage.getItem('radarMapData');

      //데이터 불러오기
      if (raw) {
        const { aptDataFull, regionCode } = JSON.parse(raw);
        const loc_y = aptDataFull["Y"];
        const loc_x = aptDataFull["X"];

        origin_x = loc_x
        origin_y = loc_y        

        apt_name = aptDataFull["아파트명"]
        selectedSubRegion = regionCode        

        changeMetaTag( aptDataFull["아파트명"], aptDataFull["법정동주소"], aptDataFull["rank"].toFixed(), aptDataFull["법정동주소"], "", Math.round(aptDataFull["가치 총점"] * 100) / 100 );
        showDetail(aptDataFull)
        loadRadarMap(loc_x, loc_y, aptDataFull)

      } else {
          console.warn('데이터가 존재하지 않습니다. 이전 창에서 다시 열어주세요.');
      }

      if (window.parent && typeof window.parent.showRadarIframe === 'function') {
        setTimeout(function(){
          window.parent.$("#pageLoadingBack").remove()
          window.parent.showRadarIframe();
        }, 150)                
      }      
    });

    $(document).ready(function () {      
      $("#dataList").css({'padding-top':'55px', 'padding-left':'10px', 'padding-right':'10px', 'padding-bottom':'5px'})
      $("#dataList_wrapper").css({'height' : window.innerHeight})
      
      $(document).on('click', '.check-facility', function (e) {
        e.stopPropagation(); // 상위 .popSubTableRadar 클릭 이벤트 차단
      });

      // 2. .popSubTableRadar 클릭 시 내부 체크박스 토글
      $(document).on('click', '.popSubTableRadar', function () {
        const $checkbox = $(this).find('.check-facility');
        const newState = !$checkbox.prop('checked');
        $checkbox.prop('checked', newState).trigger('change');
      });

      $(document).on('click', '.popTitleRadar', function () {
        const $checkbox = $(this).find('.check-facility');
        const newState = !$checkbox.prop('checked');
        $checkbox.prop('checked', newState).trigger('change');
      })

      // 3. 체크박스 상태 변경 시 icon_show_hide 함수 호출
      $(document).on('change', '.check-facility', function () {
        const id = $(this).attr('id');
        const isChecked = $(this).is(':checked');
        icon_show_hide(id, isChecked); // 인자로 id와 상태 전달
      });

      //모바일일 때, Map 화면
      info_pos = window.innerHeight * 2/3 + 10
      info_size = window.innerHeight * 1/3
      if(isMobile){        
        $("#dataMap").css({'height': window.innerHeight, 'width' : '100%'})
        $("#dataList_wrapper").css({'position':'fixed', 'top': info_pos + 'px', 'height' : info_size + 'px', 
        'background-color': 'rgba(255, 255, 255, 0)', 'box-shadow': 'rgba(0, 0, 0, 0.06) 0px -6px 6px, rgba(0, 0, 0, 0.12) 0px -4px 4px',
        'border-top-left-radius' : '10px', 'border-top-right-radius' : '10px', 'font-size':'0.9em'})
        $("#dataList").css({'background-color': 'rgba(255, 255, 255, 1)', 'padding':'0px'})
        $("#titleBar_radar").hide()        
        $("#apt_info").hide()
        $("#visit_like_card").hide()
        $(".mobile_card").css({'margin-left':'5px', 'margin-right':'5px'})
      }
      else{
        $("#titleBar_radar").css({'z-index' : 1000})
      }

      //창 크기 조정 완료 시
      if(!isMobile){
        $(window).resize(function() {
          clearTimeout(window.resizedFinished);
          window.resizedFinished = setTimeout(function(){
            dw = window.innerWidth - 500
            dh = window.innerHeight
            new_window_size = new naver.maps.Size(window.innerWidth - 500, window.innerHeight)
            defaultMap.setSize(new_window_size)

            $("#dataList_wrapper").css({'height' : window.innerHeight})
            
          }, 50);
        });
      }
    });

    function closeSelfIframe() {
      if (window.parent && typeof window.parent.closeRadar === 'function') {
        window.parent.closeRadar(); // 부모 창의 closeRadar 호출
      } else {
        alert("부모 창과 연결할 수 없습니다.");
      }
    }

    function showDetail(aptData) {
      if(isMobile){
        $(".modal-backdrop").css({"width":"100%"})
        $("#baseModal").css({"width":"100%"})
      }
      else{
        $(".modal-backdrop").css({"width":"600px"})
        $("#baseModal").css({"width":"600px"})
      }      

      detail_loading = true
      titleHtml = "";
      detailHtml = "";
      detailHtml_mobile = ""
      footerHtml = "";

      var aptName = aptData["아파트명"];
      var rank = aptData["rank"].toFixed();
      var apt_m = aptData["전용면적(m2)"];
      var apt_p = aptData["전용면적(평)"];
      var apt_type = aptData["매매타입"];
      var aptAddress = aptData["도로명주소"];
      var aptValue = Math.round(aptData["가치 총점"] * 100) / 100;
      var aptDuration = aptData["준공년차"];
      var aptYear = "";
      var short_name = $("#sido option:selected").text() + " " + $("#gungu option:selected").text();

      complex_grade = setGrade(aptValue)
      eventURL = aptData["sURL"];

      gtag("event", "아파트상세", {
        event_category: short_name,
        event_label: aptName + "(" + short_name + ")",
      });

      if (apt_type == "아파트") { aptYear =   aptData["준공년월"] + " (" + aptDuration + "년차)"; }
      if (apt_type == "재건축") { aptYear =   aptData["준공년월"] +   " (" +   aptDuration +   "년차, 재건축)"; }

    function price_sDateChange(val) {
      startVal = Number(val) + 1;
      endVal = $("#pEnd").val();

      eDateOption = "";
      for (var w = startVal; w < sales_history_date.length; w++) {
        eDateOption += "<option value='" + w + "'>" + "'" + sales_history_date[w].substr(2, 2) + "." + sales_history_date[w].substr(4, 2) + "</option>";
      }
      $("#pEnd").html(eDateOption);

      if (endVal > startVal) {
        $("#pEnd").val(endVal).prop("selected", true);
      } else {
        endVal = $("#pEnd").val();
      }

      priceChartUpdate( priceCharts, sales_history_price, sales_history_date, startVal, endVal );
    }

    function price_eDateChange(val) {
      startVal = $("#pStart").val();
      endVal = Number(val) - 1;

      priceChartUpdate( priceCharts, sales_history_price, sales_history_date, startVal, endVal );
    }

    function priceChartUpdate( priceChart, sales_history_price, sales_history_date, sVal, eVal ) {
      for (var p = 0; p < priceChart.length; p++) {
        sales_grayHistory1 = [];
        sales_pHistory = [];
        sales_grayHistory2 = [];

        sales_pHistory.push(null);
        sales_grayHistory1.push(null);
        sales_grayHistory2.push(null);

        sales_dHistory = [];
        sales_dHistory.push("");

        for (var y = 0; y < sales_history_date.length; y++) {
          if (y < sVal) {
            if (sales_history_price[p][y] == 0) {
              sales_grayHistory1.push(0);
            } else {
              sales_grayHistory1.push(
                (sales_history_price[p][y] / 10000).toFixed(1)
              );
            }
            sales_pHistory.push(null);
            sales_grayHistory2.push(null);
          }
          if (y >= sVal && y <= eVal) {
            sales_grayHistory1.push(null);
            if (sales_history_price[p][y] == 0) {
              sales_pHistory.push(0);
            } else {
              sales_pHistory.push(
                (sales_history_price[p][y] / 10000).toFixed(1)
              );
            }
            sales_grayHistory2.push(null);
          }
          if (y > eVal) {
            sales_grayHistory1.push(null);
            sales_pHistory.push(null);
            if (sales_history_price[p][y] == 0) {
              sales_grayHistory2.push(0);
            } else {
              sales_grayHistory2.push(
                (sales_history_price[p][y] / 10000).toFixed(1)
              );
            }
          }
          //sales_pHistory.push( (sales_history_price[p][y]/10000).toFixed(1) )
          sales_dHistory.push(
            "'" +
              sales_history_date[y].substr(2, 2) +
              "." +
              sales_history_date[y].substr(4, 2)
          );
        }
        sales_pHistory.push(null);
        sales_grayHistory1.push(null);
        sales_grayHistory2.push(null);
        sales_dHistory.push("");

        chartView[p].data.datasets[0].data = sales_grayHistory1;
        chartView[p].data.datasets[1].data = sales_pHistory;
        chartView[p].data.datasets[2].data = sales_grayHistory2;
        chartView[p].update();

        sPrice = sales_history_price[p][sVal];
        ePrice = sales_history_price[p][eVal - 1];
        priceGap = ((ePrice - sPrice) / 10000).toFixed(2);
        priceRatio = ((ePrice / sPrice - 1) * 100).toFixed(1);

        priceChangeText = "";
        priceChangeText +=
          (sPrice / 10000).toFixed(2) +
          " → " +
          (ePrice / 10000).toFixed(2) +
          "억";

        priceRatioText = "";
        if (sPrice == 0) {
          priceRatioText += " ( --- , --- )";
        } else {
          if (priceGap >= 0) {
            priceRatioText += " (+" + priceGap + "억, ";
          } else {
            priceRatioText += " (" + priceGap + "억, ";
          }

          if (priceRatio > 0) {
            priceRatioText +=
              "<span style='color:#fe4040'>▲" + priceRatio + "%</span>)";
          } else if (priceRatio == 0) {
            priceRatioText +=
              "<span style='color:#000'>" + priceRatio + "%</span>)";
          } else {
            priceRatioText +=
              "<span style='color:blue'>▼" + priceRatio * -1 + "%</span>)";
          }
        }
        $("#pChange" + p).html(priceChangeText);
        $("#pRatio" + p).html(priceRatioText);
      }
    }
