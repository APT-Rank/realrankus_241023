<script>
  // 2026-11-07: radarMap_test.html - radarMap.html과 100% 동일하게 보여지며, 공통 모듈 js/radar_modal_view.js를 사용하는 검증 페이지
  var regionName = "";
  var selectedSubRegion = "";
  var apt_name = "";
  var login_status = false;

  function changeMetaTag(aptName, road_Address, rank, law_Address, sub_region, score) {
    var isEn = (typeof LANG !== 'undefined' && LANG === 'en') || (sessionStorage.getItem('LANG') === 'en');
    var main_title = aptName + " 입지 분석 | 리얼랭커스";
    var meta_description = aptName + "의 주거, 교통, 인프라, 교육 환경 분석 정보를 데이터로 확인하세요.";
    $(document).attr("title", main_title);
    $("meta[property='og\\:title']").attr("content", main_title);
    $("meta[property='og\\:description']").attr("content", meta_description);
  }

  function closeSelfIframe() {
    if (window.parent && typeof window.parent.closeRadar === 'function') {
      window.parent.closeRadar();
    } else {
      alert("부모 창과 연결할 수 없습니다.");
    }
  }

  window.addEventListener('DOMContentLoaded', () => {
    const raw = sessionStorage.getItem('radarMapData');

    if (raw) {
      try {
        const { aptDataFull, loginStatus, regionCode } = JSON.parse(raw);
        apt_name = aptDataFull["아파트명"];
        selectedSubRegion = regionCode;
        login_status = loginStatus;
        changeMetaTag(aptDataFull["아파트명"], aptDataFull["법정동주소"], Number(aptDataFull["rank"]).toFixed(), aptDataFull["법정동주소"], "", Math.round(aptDataFull["가치 총점"] * 100) / 100);
        renderRadarModalView(aptDataFull);
      } catch (e) {
        console.error("radarMapData 파싱 실패:", e);
        loadDefaultSample();
      }
    } else {
      // 2026-11-07: 세션 데이터가 없을 경우 테스트를 위해 아크로리버파크 기본 로드
      console.warn('세션 데이터가 없습니다. 아크로리버파크(서초구 반포동) 테스트 데이터를 로드합니다.');
      loadDefaultSample();
    }

    if (window.parent && typeof window.parent.showRadarIframe === 'function') {
      setTimeout(function () {
        window.parent.$("#pageLoadingBack").remove();
        window.parent.showRadarIframe();
      }, 150);
    }
  });

  // 2026-11-07: 독립 실행 시 기본 샘플(서초구 아크로리버파크) 로드 함수
  function loadDefaultSample() {
    $.getJSON("./202611/1165000000_Seoul_Seocho.json")
      .done(function (res) {
        if (res && Array.isArray(res.data) && res.data.length > 0) {
          var sample = res.data.find(function (item) {
            return String(item['검색코드']) === "107613" || item['아파트명'] === "아크로리버파크";
          }) || res.data[0];
          console.log("기본 테스트 단지 로드:", sample['아파트명']);
          changeMetaTag(sample["아파트명"], sample["법정동주소"], Number(sample["rank"]).toFixed(), sample["법정동주소"], "", Math.round(sample["가치 총점"] * 100) / 100);
          renderRadarModalView(sample);
        }
      })
      .fail(function (err) {
        console.error("샘플 데이터 로드 실패:", err);
      });
  }
</script>
