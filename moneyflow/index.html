  function fetchJsonWithProgress(primaryUrl, fallbackUrl, onProgress) {
    function loadUrl(url) {
      return new Promise(function(resolve, reject) {
        var xhr = new XMLHttpRequest();
        xhr.open("GET", url, true);
        xhr.responseType = "text";
        xhr.onprogress = function(evt) {
          if (typeof onProgress === "function") {
            if (evt.lengthComputable && evt.total > 0) {
              onProgress(evt.loaded / evt.total);
            } else if (evt.loaded > 0) {
              onProgress(Math.min(0.9, evt.loaded / (evt.loaded + 500000)));
            }
          }
        };
        xhr.onload = function() {
          if (xhr.status >= 200 && xhr.status < 300) {
            try {
              var parsed = JSON.parse(xhr.responseText);
              if (typeof onProgress === "function") onProgress(1);
              resolve(parsed);
            } catch (e) {
              reject(e);
            }
          } else {
            reject(new Error("HTTP " + xhr.status));
          }
        };
        xhr.onerror = function() { reject(new Error("Network error")); };
        xhr.send();
      });
    }
    return loadUrl(primaryUrl).catch(function() {
      if (fallbackUrl) return loadUrl(fallbackUrl);
      throw new Error("Failed to load " + primaryUrl);
    });
  }

  function loadMoneyFlowAptData() {
    if (moneyflow_apt_market && moneyflow_apt_market["TIME"]) {

      return json;
    }).catch(function(err) {
      moneyflowAptPromise = null;
      console.error("Failed to load market_moneyflow_apt.json:", err);
      return null;
    });
    return moneyflowAptPromise;
  }

        }

        // 비로그인 사용자는 대용량 차트 데이터 다운로드 및 렌더링 생략
        if (!canShowCharts) {
          var loginHtml = "<div class='loginBox'>"
          loginHtml += "<div style='height:260px'></div>"
          loginHtml += "<div id='aptrankLoginGuide'>시장 지표의 시계열과 그래프를 확인하세요</div>"
          loginHtml += "<div id='aptrankLoginButton' data-bs-toggle='modal' data-bs-target='#loginModal' onClick='showLogin()'>리얼랭커스 로그인</div>"
          loginHtml += "</div>"
          $('#graph_area').html(loginHtml);
          return;
        }

        // 2단계: 핵심 차트 데이터(daily + moneyflow) 병렬 비동기 로드 + 실시간 진행률(%) 갱신
        renderPcLoader(22, "시장·통화량 데이터 수신 중...");
        var progDaily = 0;
        var progMf = 0;
        function updatePhase2Progress() {
          // 22% ~ 92% 구간을 실제 다운로드 비율로 표시 (daily 가중치 70%, moneyflow 30%)
          var ratio = (progDaily * 0.7) + (progMf * 0.3);
          var pct = 22 + Math.round(ratio * 70);
          renderPcLoader(pct, "시장·통화량 데이터 수신 중...");
        }

        var pDaily = fetchJsonWithProgress(daily_url, "./market_daily_info.json", function(r) {
          progDaily = r;
          updatePhase2Progress();
        });
        var pMf = fetchJsonWithProgress(moneyflow_url, "./market_moneyflow.json", function(r) {
          progMf = r;
          updatePhase2Progress();
        }).catch(function() { return null; });

        return Promise.all([pDaily, pMf]).then(function(res2) {
          daily_market = res2[0];
          if (daily_market && daily_market["GENERATE"] && daily_market["GENERATE"][0]) {
            daily_updated = (daily_market["GENERATE"][0]).substr(0, 19);
          }
          if (res2[1]) {
            moneyflow_market = res2[1];
            moneyflow_updated = (moneyflow_market["GENERATE"] && moneyflow_market["GENERATE"][0]) ? (moneyflow_market["GENERATE"][0]).substr(0, 19) : "";
          }

          renderPcLoader(95, "차트 그리는 중...");

          // 브라우저가 95% 상태를 한 프레임 그린 뒤 차트 렌더링 실행
          requestAnimationFrame(function() {
            setTimeout(function() {
              // 미국 기준금리/통화량(daily_market 기반) 반영을 위해 좌측 패널 갱신
              if (hourly_market && hourly_market !== "") {
                shareText = shareTitle + "\n\n";
                $('#hourly_info').empty();
                $('#hourly_area').empty();
                show_hourly_info();
              }

              $('#shortcut').empty();
              $('#graph_area').empty();
              if (daily_market && daily_market !== "") {
                show_daily_info();
              } else {
                $('#graph_area').append("<div style='text-align:center; padding: 20px; color:red;'>일간 시장지표(Daily) 데이터를 불러올 수 없습니다.</div>");
              }

              // 3단계: Real Estate(APT) 대용량 데이터는 초기 렌더링 완료 후 백그라운드 유휴 시점에 지연 프리페치
              if (typeof requestIdleCallback === "function") {
                requestIdleCallback(function() { loadMoneyFlowAptData(); }, { timeout: 4000 });
              } else {
                setTimeout(function() { loadMoneyFlowAptData(); }, 2500);
              }
            }, 16);
          });
        });
      })
      .catch(function(err) {
        console.error("MoneyFlow 초기 데이터 로드 실패:", err);
        $('#graph_area').html("<div style='text-align:center; padding: 40px; color:#dc2626;'>시장 데이터를 불러오는 중 오류가 발생했습니다. 새로고침해 주세요.</div>");
      });
});
