<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover" />
  <title>리얼랭커스 3D 평면도 — Floorplan 3D</title>
  <script type="importmap">
    {
      "imports": {
        "three": "https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.module.js",
        "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.160.0/examples/jsm/"
      }
    }
  </script>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      font-family: -apple-system, BlinkMacSystemFont, "Malgun Gothic", "Noto Sans KR", sans-serif;
      background: #10141c;
      color: #f8fafc;
      overflow: hidden;
      width: 100vw;
      height: 100vh;
    }
    #canvas-wrap { position: absolute; inset: 0; }
    .panel {
      position: absolute;
      top: 16px;
      left: 16px;
      width: 320px;
      max-height: calc(100vh - 32px);
      overflow-y: auto;
      background: rgba(15, 23, 42, 0.82);
      backdrop-filter: blur(18px);
      -webkit-backdrop-filter: blur(18px);
      border: 1px solid rgba(255, 255, 255, 0.14);
      border-radius: 14px;
      padding: 15px 16px;
      box-shadow: 0 20px 50px rgba(0, 0, 0, 0.55);
      z-index: 10;
    }
    .panel::-webkit-scrollbar { width: 5px; }
    .panel::-webkit-scrollbar-thumb { background: rgba(148,163,184,0.35); border-radius: 4px; }
    .panel h1 {
      font-size: 15px;
      font-weight: 800;
      display: flex;
      align-items: center;
      gap: 8px;
      margin-bottom: 10px;
      letter-spacing: -0.2px;
    }
    .badge {
      background: linear-gradient(135deg, #E43B46, #f97316);
      color: #fff;
      font-size: 10px;
      padding: 2px 7px;
      border-radius: 6px;
      font-weight: 700;
    }
    .section {
      border-top: 1px solid rgba(148, 163, 184, 0.16);
      padding-top: 10px;
      margin-top: 10px;
    }
    .section-title {
      font-size: 10.5px;
      font-weight: 700;
      color: #94a3b8;
      margin-bottom: 7px;
      text-transform: uppercase;
      letter-spacing: 0.5px;
    }
    .btn-row { display: grid; grid-template-columns: 1fr 1fr; gap: 6px; }
    .btn-row-3 { display: grid; grid-template-columns: repeat(3, 1fr); gap: 6px; }
    .btn-row-4 { display: grid; grid-template-columns: repeat(4, 1fr); gap: 5px; }
    button, .file-btn {
      background: rgba(30, 41, 59, 0.85);
      color: #e2e8f0;
      border: 1px solid rgba(148, 163, 184, 0.22);
      border-radius: 8px;
      padding: 7px 6px;
      font-size: 11.5px;
      font-weight: 600;
      cursor: pointer;
      transition: all 0.16s ease;
      text-align: center;
      display: inline-block;
    }
    button:hover, .file-btn:hover {
      background: rgba(51, 65, 85, 0.95);
      border-color: rgba(255,255,255,0.35);
    }
    button.active {
      background: #E43B46;
      border-color: #E43B46;
      color: #fff;
      box-shadow: 0 4px 12px rgba(228, 59, 70, 0.35);
    }
    .file-btn { width: 100%; margin-top: 6px; border-style: dashed; }
    .search-input {
      width: 100%;
      background: rgba(15, 23, 42, 0.9);
      color: #f8fafc;
      border: 1px solid rgba(148, 163, 184, 0.35);
      border-radius: 8px;
      padding: 8px 10px;
      font-size: 12px;
      outline: none;
      margin-bottom: 6px;
    }
    .search-input:focus {
      border-color: #E43B46;
      box-shadow: 0 0 0 2px rgba(228, 59, 70, 0.25);
    }
    .catalog-list {
      max-height: 155px;
      overflow-y: auto;
      border: 1px solid rgba(148, 163, 184, 0.18);
      border-radius: 8px;
      background: rgba(15, 23, 42, 0.65);
      margin-bottom: 8px;
    }
    .catalog-list::-webkit-scrollbar { width: 5px; }
    .catalog-list::-webkit-scrollbar-thumb { background: rgba(148,163,184,0.35); border-radius: 4px; }
    .catalog-item {
      padding: 6px 9px;
      cursor: pointer;
      border-bottom: 1px solid rgba(148, 163, 184, 0.1);
      transition: background 0.12s;
    }
    .catalog-item:last-child { border-bottom: none; }
    .catalog-item:hover { background: rgba(51, 65, 85, 0.7); }
    .catalog-item.active { background: rgba(228, 59, 70, 0.28); border-left: 3px solid #E43B46; }
    .catalog-item-top {
      display: flex;
      justify-content: space-between;
      align-items: center;
      font-size: 12px;
      font-weight: 700;
      color: #f8fafc;
      gap: 6px;
    }
    .catalog-item-cnt {
      font-size: 10px;
      color: #94a3b8;
      background: rgba(30, 41, 59, 0.9);
      padding: 1px 5px;
      border-radius: 4px;
      flex-shrink: 0;
    }
    .catalog-item-addr {

      color: #94a3b8;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
      margin-top: 2px;
    }
    .type-grid {
      display: flex;
      flex-wrap: wrap;
      gap: 5px;
      max-height: 92px;
      overflow-y: auto;
      padding: 2px 0;
    }
    .type-btn {
      padding: 4px 8px;
      font-size: 11px;
      border-radius: 6px;
    }
    .row-between {
      display: flex;
      justify-content: space-between;
      align-items: center;
      font-size: 11.5px;

    input[type="range"] { width: 100%; accent-color: #E43B46; cursor: pointer; }
    .toggle-row {
      display: flex;
      align-items: center;
      justify-content: space-between;
      font-size: 12px;
      padding: 3.5px 0;

    .meta-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 6px; font-size: 11px; }
    .meta-box {

    .meta-val { color: #f8fafc; font-weight: 700; margin-top: 2px; }
    .room-list { display: flex; flex-wrap: wrap; gap: 4px; margin-top: 7px; }
    .room-chip {

      font-weight: 700;

    .drop-hint.show { display: flex; }
    .label-layer { position: absolute; inset: 0; pointer-events: none; overflow: hidden; z-index: 5; }
    .room-label {
      position: absolute;
      transform: translate(-50%, -50%);
      background: rgba(15, 23, 42, 0.78);
      backdrop-filter: blur(6px);
      color: #f8fafc;
      border: 1px solid rgba(255, 255, 255, 0.22);
      border-radius: 6px;

    .room-label:hover {
      background: #86efac;
      border-color: #4ade80;

    /* Hover Room Dimension Badge */
    .dim-badge {
      position: fixed;
      transform: translate(-50%, -100%);

      border: 1.5px solid #86efac;
      color: #dcfce7;
      border-radius: 8px;
      padding: 5px 10px;
      font-size: 12px;
      font-weight: 700;
      white-space: nowrap;

    .dim-badge span {
      color: #86efac;
      font-weight: 800;
    }
    /* Top-Right N/S/W/E Compass Widget */
    .compass-box {
      position: absolute;
      top: 16px;
      right: 16px;
      width: 92px;
      height: 92px;
      border-radius: 50%;
      background: rgba(15, 23, 42, 0.82);
      backdrop-filter: blur(14px);
      -webkit-backdrop-filter: blur(14px);
      border: 1px solid rgba(255, 255, 255, 0.16);
      box-shadow: 0 12px 30px rgba(0, 0, 0, 0.45);
      z-index: 20;
      user-select: none;

    .compass-btn {
      position: absolute;
      width: 22px;
      height: 22px;
      padding: 0;
      border-radius: 50%;
      font-size: 11px;
      font-weight: 800;
      display: flex;
      align-items: center;
      justify-content: center;
      background: rgba(30, 41, 59, 0.9);
      border: 1px solid rgba(148, 163, 184, 0.35);
      color: #e2e8f0;
      cursor: pointer;
      transition: all 0.14s ease;
    }
    .compass-btn:hover {
      background: #E43B46;
      border-color: #E43B46;
      color: #fff;
      transform: scale(1.1);
    }
    .compass-btn-n { top: 4px; left: 50%; transform: translateX(-50%); color: #fca5a5; }
    .compass-btn-n:hover { transform: translateX(-50%) scale(1.1); }
    .compass-btn-s { bottom: 4px; left: 50%; transform: translateX(-50%); }
    .compass-btn-s:hover { transform: translateX(-50%) scale(1.1); }
    .compass-btn-w { left: 4px; top: 50%; transform: translateY(-50%); }
    .compass-btn-w:hover { transform: translateY(-50%) scale(1.1); }
    .compass-btn-e { right: 4px; top: 50%; transform: translateY(-50%); }
    .compass-btn-e:hover { transform: translateY(-50%) scale(1.1); }
    .compass-dial {
      position: absolute;
      top: 50%;
      left: 50%;
      width: 36px;
      height: 36px;
      transform: translate(-50%, -50%);
      border-radius: 50%;
      background: rgba(30, 41, 59, 0.75);
      border: 1px solid rgba(148, 163, 184, 0.25);
      cursor: pointer;
    }
    .compass-needle {
      position: absolute;
      inset: 0;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
    }
    .needle-n {
      width: 0; height: 0;
      border-left: 4px solid transparent;
      border-right: 4px solid transparent;
      border-bottom: 12px solid #E43B46;
    }
    .needle-s {
      width: 0; height: 0;
      border-left: 4px solid transparent;
      border-right: 4px solid transparent;
      border-top: 12px solid #cbd5e1;
    }
    .status-bar {
      position: absolute;
      bottom: 14px;
      right: 16px;
      background: rgba(15, 23, 42, 0.78);
      backdrop-filter: blur(10px);
      border: 1px solid rgba(255, 255, 255, 0.14);
      border-radius: 9px;
      padding: 7px 13px;
      font-size: 11.5px;
      color: #e2e8f0;
      z-index: 10;
    }

    .mobile-toggle-btn {
      display: none;
      position: fixed;
      bottom: calc(18px + env(safe-area-inset-bottom));
      left: 16px;
      z-index: 35;
      background: linear-gradient(135deg, #E43B46, #f97316);
      color: #fff;
      border: none;
      border-radius: 999px;
      padding: 11px 18px;
      font-size: 13px;
      font-weight: 800;
      box-shadow: 0 10px 28px rgba(228, 59, 70, 0.45);
      cursor: pointer;
    }
    @media (max-width: 768px) {
      .mobile-toggle-btn { display: inline-flex; align-items: center; gap: 6px; }
      .panel {
        top: auto;
        bottom: 0;
        left: 0;
        right: 0;
        width: 100%;
        max-height: 68vh;
        border-radius: 18px 18px 0 0;
        transform: translateY(105%);
        transition: transform 0.28s cubic-bezier(0.22, 1, 0.36, 1);
        padding-bottom: calc(68px + env(safe-area-inset-bottom));
      }
      .panel.mobile-open {
        transform: translateY(0);
      }
      .status-bar {
        display: none;
      }
      .compass-wrap {
        top: 12px;
        right: 12px;
        transform: scale(0.86);
        transform-origin: top right;
      }
    }
  </style>
</head>
<body>
  <div id="canvas-wrap"></div>
  <div id="label-layer" class="label-layer"></div>

  <div id="drop-hint" class="drop-hint">여기에 floorplan_3d JSON 파일을 드롭하세요</div>

  <!-- Top-Right N/S/W/E Compass -->

    <button class="compass-btn compass-btn-w" data-dir="W" title="서쪽(W) 방향 보기">W</button>
    <button class="compass-btn compass-btn-e" data-dir="E" title="동쪽(E) 방향 보기">E</button>
    <div class="compass-dial" id="compass-dial" title="기본 남향 뷰 정렬">

  <button class="mobile-toggle-btn" id="mobile-toggle-btn">단지 / 평형 선택</button>
  <div class="panel" id="main-panel">
    <h1>3D 평면도 ArchViz <span class="badge">ULTRA PBR</span></h1>

    <div class="section-title" style="display:flex;justify-content:space-between;align-items:center;">
      <span>단지 검색</span>

    <div class="section">

      <div class="btn-row-4">
        <button id="light-morning">아침</button>
        <button id="light-noon" class="active">정오</button>
        <button id="light-sunset">노을</button>
        <button id="light-night">야간</button>

    </div>

    <div class="section">
      <div class="section-title">카메라 시점</div>

        <button id="cam-iso" class="active">3D 아이소</button>

    <div class="section">
      <div class="section-title">렌더링 옵션</div>
      <div class="row-between">
        <span>벽체 단면 높이</span>

  <div class="status-bar" id="status-bar">
    4K Soft Shadows · Procedural PBR Wood/Tile · True Wall Cutouts · Interior Lighting
  </div>

  <script type="module">
    import * as THREE from "three";
    import { OrbitControls } from "three/addons/controls/OrbitControls.js";
    import { RoomEnvironment } from "three/addons/environments/RoomEnvironment.js";
    import { EffectComposer } from "three/addons/postprocessing/EffectComposer.js";
    import { RenderPass } from "three/addons/postprocessing/RenderPass.js";
    import { UnrealBloomPass } from "three/addons/postprocessing/UnrealBloomPass.js";
    import { OutputPass } from "three/addons/postprocessing/OutputPass.js";

    const BUILTIN_SAMPLES = {
      "H_84A": "../data/floorplan_3d/111515/84A.json",
      "H_109E": "../data/floorplan_3d/111515/109E.json",
      "107A": "../data/floorplan_3d/111515/107A.json",
      "110D": "../data/floorplan_3d/111515/110D.json",
      "84A": "../data/samples/sample_84A_4bay.json",
      "84B": "../data/samples/sample_84B_tower.json"
    };

    // =========================================================================
    // 1. High-Resolution Procedural PBR Texture Generators (1024x1024)
    // =========================================================================
    const IS_MOBILE_GL = window.innerWidth <= 768 || /Mobi|Android|iPhone|iPad/i.test(navigator.userAgent);
    function makeWoodPBR(baseHex, grainHex, plankRows = 8, plankCols = 4) {
      const size = IS_MOBILE_GL ? 512 : 1024;
      const diffC = document.createElement("canvas");
      const bumpC = document.createElement("canvas");
      const roughC = document.createElement("canvas");
      diffC.width = bumpC.width = roughC.width = size;
      diffC.height = bumpC.height = roughC.height = size;
      const dCtx = diffC.getContext("2d");
      const bCtx = bumpC.getContext("2d");
      const rCtx = roughC.getContext("2d");

      const base = new THREE.Color(baseHex);
      const grain = new THREE.Color(grainHex);
      const rowH = size / plankRows;
      const colW = size / plankCols;

      // Deterministic pseudo-random
      let seed = 1337;
      const rand = () => { seed = (seed * 16807) % 2147483647; return (seed - 1) / 2147483646; };

      for (let r = 0; r < plankRows; r++) {
        const offset = (r % 2) * (colW * 0.5);
        for (let c = -1; c <= plankCols; c++) {
          const x = c * colW + offset;
          const y = r * rowH;
          const tint = (rand() - 0.5) * 0.08;
          const col = base.clone().offsetHSL(0, (rand() - 0.5) * 0.04, tint);

          dCtx.fillStyle = `#${col.getHexString()}`;
          dCtx.fillRect(x, y, colW, rowH);

          const rv = Math.floor(105 + rand() * 30);
          rCtx.fillStyle = `rgb(${rv},${rv},${rv})`;
          rCtx.fillRect(x, y, colW, rowH);

          bCtx.fillStyle = `rgb(185,185,185)`;
          bCtx.fillRect(x, y, colW, rowH);

          // Fine wood grain streaks
          for (let g = 0; g < 36; g++) {
            const gy = y + rand() * rowH;
            const alpha = 0.04 + rand() * 0.09;
            dCtx.strokeStyle = `rgba(${Math.floor(grain.r*255)},${Math.floor(grain.g*255)},${Math.floor(grain.b*255)},${alpha})`;
            dCtx.lineWidth = 1 + rand() * 2.5;
            dCtx.beginPath();
            dCtx.moveTo(x, gy);
            dCtx.bezierCurveTo(
              x + colW * 0.33, gy + (rand() - 0.5) * 6,
              x + colW * 0.66, gy + (rand() - 0.5) * 6,
              x + colW, gy + (rand() - 0.5) * 3
            );
            dCtx.stroke();

            bCtx.strokeStyle = `rgba(140,140,140,${alpha * 1.4})`;
            bCtx.lineWidth = 1;
            bCtx.stroke();
          }

          // Plank bevel seams
          dCtx.strokeStyle = "rgba(45, 30, 18, 0.38)";
          dCtx.lineWidth = 2.5;
          dCtx.strokeRect(x, y, colW, rowH);

          bCtx.strokeStyle = "rgb(40,40,40)";
          bCtx.lineWidth = 3;
          bCtx.strokeRect(x, y, colW, rowH);

          rCtx.strokeStyle = "rgb(235,235,235)";
          rCtx.lineWidth = 3;
          rCtx.strokeRect(x, y, colW, rowH);
        }
      }

      const wrapTex = (canvas, isColor = false) => {
        const tex = new THREE.CanvasTexture(canvas);
        tex.wrapS = tex.wrapT = THREE.RepeatWrapping;
        tex.repeat.set(0.35, 0.35);
        tex.anisotropy = 16;
        if (isColor) tex.colorSpace = THREE.SRGBColorSpace;
        return tex;
      };
      return {
        map: wrapTex(diffC, true),
        bumpMap: wrapTex(bumpC, false),
        roughnessMap: wrapTex(roughC, false)
      };
    }

    function makeTilePBR(baseHex, groutHex, tiles = 4, veining = true, roughBase = 75) {
      const size = IS_MOBILE_GL ? 512 : 1024;
      const diffC = document.createElement("canvas");
      const bumpC = document.createElement("canvas");
      const roughC = document.createElement("canvas");
      diffC.width = bumpC.width = roughC.width = size;
      diffC.height = bumpC.height = roughC.height = size;
      const dCtx = diffC.getContext("2d");
      const bCtx = bumpC.getContext("2d");
      const rCtx = roughC.getContext("2d");

      const step = size / tiles;
      const base = new THREE.Color(baseHex);
      let seed = 4242;
      const rand = () => { seed = (seed * 16807) % 2147483647; return (seed - 1) / 2147483646; };

      for (let r = 0; r < tiles; r++) {
        for (let c = 0; c < tiles; c++) {
          const x = c * step, y = r * step;
          const col = base.clone().offsetHSL(0, 0, (rand() - 0.5) * 0.03);
          dCtx.fillStyle = `#${col.getHexString()}`;
          dCtx.fillRect(x, y, step, step);

          bCtx.fillStyle = "rgb(200,200,200)";
          bCtx.fillRect(x, y, step, step);

          const rv = Math.floor(roughBase + rand() * 20);
          rCtx.fillStyle = `rgb(${rv},${rv},${rv})`;
          rCtx.fillRect(x, y, step, step);

          if (veining) {
            for (let v = 0; v < 5; v++) {
              dCtx.strokeStyle = `rgba(140,145,150,${0.04 + rand() * 0.08})`;
              dCtx.lineWidth = 1 + rand() * 3;
              dCtx.beginPath();
              dCtx.moveTo(x + rand() * step, y);
              dCtx.bezierCurveTo(
                x + rand() * step, y + step * 0.35,
                x + rand() * step, y + step * 0.7,
                x + rand() * step, y + step
              );
              dCtx.stroke();
            }
          }
          // Grout lines
          dCtx.strokeStyle = groutHex;
          dCtx.lineWidth = 5;
          dCtx.strokeRect(x, y, step, step);

          bCtx.strokeStyle = "rgb(45,45,45)";
          bCtx.lineWidth = 6;
          bCtx.strokeRect(x, y, step, step);

          rCtx.strokeStyle = "rgb(235,235,235)";
          rCtx.lineWidth = 6;
          rCtx.strokeRect(x, y, step, step);
        }
      }
      const wrapTex = (canvas, isColor = false) => {
        const tex = new THREE.CanvasTexture(canvas);
        tex.wrapS = tex.wrapT = THREE.RepeatWrapping;
        tex.repeat.set(0.45, 0.45);
        tex.anisotropy = 16;
        if (isColor) tex.colorSpace = THREE.SRGBColorSpace;
        return tex;
      };
      return {
        map: wrapTex(diffC, true),
        bumpMap: wrapTex(bumpC, false),
        roughnessMap: wrapTex(roughC, false)
      };
    }

    function makePlasterBump() {
      const size = 512;
      const c = document.createElement("canvas");
      c.width = c.height = size;
      const ctx = c.getContext("2d");
      const img = ctx.createImageData(size, size);
      for (let i = 0; i < img.data.length; i += 4) {
        const v = 120 + Math.floor(Math.random() * 24);
        img.data[i] = img.data[i+1] = img.data[i+2] = v;
        img.data[i+3] = 255;
      }
      ctx.putImageData(img, 0, 0);
      const tex = new THREE.CanvasTexture(c);
      tex.wrapS = tex.wrapT = THREE.RepeatWrapping;
      tex.repeat.set(4, 2);
      return tex;
    }

    // Prebuild PBR Material Library

    // =========================================================================

    function makeSkyDomeTexture(mode) {
      const w = 2048, h = 1024;
      const c = document.createElement("canvas");
      c.width = w; c.height = h;
      const ctx = c.getContext("2d");

      const palettes = {
        morning: ["#2c6eb5", "#6ca9dc", "#c7e2f4", "#ffe4c4", "#ffd2a0"],
        noon:    ["#1a5fb4", "#4a90d9", "#9ec9ef", "#d8ecfa", "#eef6fb"],
        sunset:  ["#1b2345", "#4c3d6e", "#b85d63", "#f29157", "#ffd28a"],
        night:   ["#040711", "#091124", "#121f3d", "#1c2d4f", "#243452"]
      };
      const pal = palettes[mode] || palettes.noon;
      const grad = ctx.createLinearGradient(0, 0, 0, h * 0.62);
      grad.addColorStop(0.0, pal[0]);
      grad.addColorStop(0.32, pal[1]);
      grad.addColorStop(0.62, pal[2]);
      grad.addColorStop(0.84, pal[3]);
      grad.addColorStop(1.0, pal[4]);
      ctx.fillStyle = grad;
      ctx.fillRect(0, 0, w, h);

      // Lower horizon haze
      ctx.fillStyle = mode === "night" ? "#0b1220" : (mode === "sunset" ? "#3b2c35" : "#9db3c4");
      ctx.fillRect(0, h * 0.58, w, h * 0.42);

      // Sun / Moon glow on +Z horizon
      const sunX = mode === "morning" ? w * 0.62 : (mode === "sunset" ? w * 0.42 : w * 0.52);
      const sunY = mode === "noon" ? h * 0.28 : (mode === "sunset" ? h * 0.48 : h * 0.38);
      if (mode !== "night") {
        const sg = ctx.createRadialGradient(sunX, sunY, 8, sunX, sunY, 260);
        sg.addColorStop(0, "rgba(255,252,235,0.95)");
        sg.addColorStop(0.18, mode === "sunset" ? "rgba(255,175,95,0.65)" : "rgba(255,245,215,0.45)");
        sg.addColorStop(1, "rgba(255,220,180,0)");
        ctx.fillStyle = sg;
        ctx.fillRect(sunX - 280, sunY - 280, 560, 560);
      } else {
        // Stars in night sky
        let s = 9001;
        const rnd = () => { s = (s * 16807) % 2147483647; return (s - 1) / 2147483646; };
        for (let i = 0; i < 420; i++) {
          ctx.fillStyle = `rgba(255,255,255,${0.25 + rnd() * 0.7})`;
          const r = 0.7 + rnd() * 1.4;
          ctx.beginPath();
          ctx.arc(rnd() * w, rnd() * h * 0.48, r, 0, Math.PI * 2);
          ctx.fill();
        }
      }

      // Soft realistic clouds
      if (mode !== "night") {
        let s = 777;
        const rnd = () => { s = (s * 16807) % 2147483647; return (s - 1) / 2147483646; };
        for (let i = 0; i < 42; i++) {
          const cx = rnd() * w;
          const cy = h * (0.18 + rnd() * 0.28);
          const rx = 60 + rnd() * 160;
          const ry = 14 + rnd() * 30;
          const cg = ctx.createRadialGradient(cx, cy, rx * 0.1, cx, cy, rx);
          const col = mode === "sunset" ? "255,210,175" : "255,255,255";
          cg.addColorStop(0, `rgba(${col},${0.32 + rnd() * 0.25})`);
          cg.addColorStop(1, `rgba(${col},0)`);
          ctx.fillStyle = cg;
          ctx.save();
          ctx.translate(cx, cy);
          ctx.scale(1, ry / rx);
          ctx.beginPath();
          ctx.arc(0, 0, rx, 0, Math.PI * 2);
          ctx.fill();
          ctx.restore();
        }
      }

      const tex = new THREE.CanvasTexture(c);
      tex.colorSpace = THREE.SRGBColorSpace;
      return tex;
    }

    function makeBuildingFacadeTex(mode, seedBase = 101) {
      const c = document.createElement("canvas");

      let s = seedBase;
      const rnd = () => { s = (s * 16807) % 2147483647; return (s - 1) / 2147483646; };
      const cols = 6, rows = 20;
      const cw = 256 / cols, rh = 512 / rows;
      for (let r = 0; r < rows; r++) {
        for (let col = 0; col < cols; col++) {
          const lit = isNight ? rnd() < 0.42 : (isSunset ? rnd() < 0.22 : false);

          }
          ctx.fillRect(col * cw + 6, r * rh + 5, cw - 12, rh - 10);

      }
      const tex = new THREE.CanvasTexture(c);
      tex.colorSpace = THREE.SRGBColorSpace;
      tex.wrapS = tex.wrapT = THREE.RepeatWrapping;

    }
