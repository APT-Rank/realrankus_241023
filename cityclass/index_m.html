  var region_class = ""

  function showModal(msg){
    msg = "<br>" + msg
    $("#aptDetail").html(msg)
    $("#noticeModal > .modal-dialog > .modal-content > .modal-header").hide()
    changeModalLabel()
    $('#noticeModal').modal('show')
    sleep(300)
    draw() 
  }

  var price_index = ""
  var balanced_index = ""
  var living_index = ""
  var infra_index = ""
  var trans_index = ""
  var edu_index = ""
  var sido_list = ""
  var gungu_list = ""

  var auxDataLoaded = false;
  var auxDataPromise = null;

  // 2026-10-23: [개선안 1: 보조 데이터 백그라운드 지연 로딩]
  // 첫 화면(가격 지표 & 지도) 표시 후 백그라운드에서 나머지 6종(균형, 주거, 인프라, 교통, 학군, 트리맵)을 병렬 수신
  function loadAuxiliaryDataInBackground() {
    if (auxDataLoaded) return Promise.resolve();
    if (auxDataPromise) return auxDataPromise;

    var pBalanced = $.getJSON(index_url_balanced).then(function(j) { balanced_index = j; });
    var pLiving   = $.getJSON(index_url_living).then(function(j) { living_index = j; });
    var pInfra    = $.getJSON(index_url_infra).then(function(j) { infra_index = j; });
    var pTrans    = $.getJSON(index_url_trans).then(function(j) { trans_index = j; });
    var pEdu      = $.getJSON(index_url_edu).then(function(j) { edu_index = j; });
    var pTreemap  = $.getJSON(cost_treemap_url).then(function(j) { cost_treemap = j; setTreeMap(); });

    auxDataPromise = Promise.all([pBalanced, pLiving, pInfra, pTrans, pEdu, pTreemap])
      .then(function() {
        auxDataLoaded = true;
      })
      .catch(function(err) {
        console.error("보조 지표 백그라운드 수신 실패:", err);
      });

    return auxDataPromise;
  }

  // 2026-10-23: [개선안 1: 화면 우선 렌더링 및 체인식 getJSON 병렬 최적화]
  // 8단계 직렬 워터폴 체인을 제거하고, 첫 화면 필수 2종(지도, 가격)을 병렬로 즉시 수신하여 70% 이상 초고속 렌더링
  function draw(){
    class_url = "./" + currentMonth + "/regional_class_" + currentMonth + ".json";
    index_url_price = "./" + currentMonth + "/cityclass_indexer_price_" + currentMonth + ".json";
    index_url_balanced = "./" + currentMonth + "/cityclass_indexer_value_" + currentMonth + ".json";
    index_url_living = "./" + currentMonth + "/cityclass_indexer_living_" + currentMonth + ".json";
    index_url_infra = "./" + currentMonth + "/cityclass_indexer_infra_" + currentMonth + ".json";
    index_url_trans = "./" + currentMonth + "/cityclass_indexer_trans_" + currentMonth + ".json";
    index_url_edu = "./" + currentMonth + "/cityclass_indexer_edu_" + currentMonth + ".json";
    cost_treemap_url = "./" + currentMonth + "/treemap_" + currentMonth + ".json";

    var fetchClass = $.getJSON(class_url);
    var fetchPrice = $.getJSON(index_url_price);

    Promise.all([fetchClass, fetchPrice])
      .then(function(results) {
        region_class = results[0];
        price_index = results[1];

        sido_list = getUniqueList(region_class, "시도");
        gungu_list = [];
        for(var i = 0 ; i < sido_list.length ;  i++){
          searched_gungu = region_class.filter(function (object){
            return object["시도"] === sido_list[i];
          });
          gungu_unique_list = getUniqueList(searched_gungu, "군구");
          gungu_list.push(gungu_unique_list);
        }

        $("#update_info_m").html("업데이트 : " + region_class[0]['updated']);

        // 첫 화면(가격 지표 테이블 및 지도) 즉시 렌더링
        drawTable(price_index, sido_list, gungu_list);
        drawMap(region_class, sido_list, gungu_list);

        // 첫 화면 렌더링 완료 후 백그라운드에서 나머지 보조 지표 6종 지연 병렬 수신
        loadAuxiliaryDataInBackground();
      })
      .catch(function(err) {
        console.error("cityclass 모바일 초기 필수 데이터 수신 실패:", err);
      });
  }

  function openURL(url){    
    if(checkMobile() == "ios"){
      window.location.href = url
    }
    else{
      window.open(url)
    }
  }

function scrollUp(){
  $( 'html, body' ).animate( { scrollTop : 0 }, 50 );
}
</script>
