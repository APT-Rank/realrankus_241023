# This workflow will install Python dependencies, run tests and lint with a single version of Python
# For more information see: https://help.github.com/actions/language-and-framework-guides/using-python-with-github-actions

name: Daily Update

on:
  schedule:    
    - cron: "0 19 * * *"
  workflow_dispatch:

permissions:
  actions: write
  checks: write
  contents: write
  deployments: write
  issues: write
  packages: write
  pull-requests: write
  repository-projects: write
  security-events: write
  statuses: write

jobs:
  build:

    runs-on: ubuntu-22.04

    steps:
    - uses: actions/checkout@v4
    - name: Set up Python 3.11
      uses: actions/setup-python@v5
      with:
        python-version: "3.11"
    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        if [ -f requirement.txt ]; then pip install -r requirement.txt; fi
    - name: get Standatd interest, Market daily
      run: |
        python BOK_Standard_Interest.py
    - name: Upload to Cloudflare R2
      env:
        R2_ENDPOINT_URL: ${{ secrets.R2_ENDPOINT_URL }}
        R2_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
        R2_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
        R2_BUCKET_NAME: "realrankus-data"
      run: |
        python ./scripts/upload_to_r2.py BOK_standatd_interest.json FED_standatd_interest.json ./moneyflow/market_daily_info.json
    - name: Commits
      run: |        
        git pull
        git config --local user.email "aptranking@gmail.com"
        git config --local user.name "APT-Rank"
        git add BOK_standatd_interest.json
        git add FED_standatd_interest.json
        git add ./moneyflow/market_daily_info.json
        git commit -m "Standard Interest, Daily Market Update"
    - name: Push
      uses: ad-m/github-push-action@master
      with:
        branch: 'master'
        github_token: '${{ secrets.GITHUB_TOKEN }}'
