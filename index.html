    import PhotoSwipeLightbox from 'https://cdnjs.cloudflare.com/ajax/libs/photoswipe/5.4.4/photoswipe-lightbox.esm.min.js';

    window.initPhotoSwipe = function() {
        if (window.pswpLightbox) {
            window.pswpLightbox.destroy();
        }

        const lightbox = new PhotoSwipeLightbox({
            gallery: '.my-pswp-gallery-wrapper',
            children: 'a.pswp-trigger-link',
            pswpModule: () => import('https://cdnjs.cloudflare.com/ajax/libs/photoswipe/5.4.4/photoswipe.esm.min.js')
        });

        // --- 다운로드 버튼 추가 시작 ---
        lightbox.on('uiRegister', function() {
            lightbox.pswp.ui.registerElement({
                name: 'download-button',
                order: 8, // 닫기 버튼(9) 옆에 배치
                isButton: true,
                tagName: 'a',
                // 다운로드 아이콘 (SVG)
                html: '<svg aria-hidden="true" class="pswp__icn" viewBox="0 0 32 32" width="32" height="32"><path d="M20.5 14.3 17.1 18V10h-2.2v7.9l-3.4-3.6L10 16l6 6.1 6-6.1ZM23 23H9v2h14Z" fill="#fff"/></svg>',
                
                onInit: (el, pswp) => {
                    el.setAttribute('target', '_blank');
                    el.setAttribute('rel', 'noopener');

                    // 이미지가 바뀔 때마다 다운로드 링크 업데이트
                    pswp.on('change', () => {
                        const currSlide = pswp.currSlide;
                        if (currSlide && currSlide.data.src) {
                            // 앞서 설정한 data-pswp-src 값을 가져옵니다.
                            const downloadUrl = currSlide.data.src;
                            el.href = downloadUrl;

                            //현재 선택된 지역 이름 받아오기
                            const sidoName = document.getElementById("sido").options[document.getElementById("sido").selectedIndex].text;
                            const regionName = document.getElementById("gungu").options[document.getElementById("gungu").selectedIndex].text;

                            // 타임스탬프 생성 (예: 20240427_153000)
                            const now = new Date();
                            const year = now.getFullYear();
                            const month = String(now.getMonth() + 1).padStart(2, '0');
                            const day = String(now.getDate()).padStart(2, '0');
                            const hours = String(now.getHours()).padStart(2, '0');
                            const minutes = String(now.getMinutes()).padStart(2, '0');
                            const seconds = String(now.getSeconds()).padStart(2, '0');
                            const timestamp = `${year}${month}${day}_${hours}${minutes}${seconds}`;                            
                            
                            // 파일명 설정 (URL에서 파일명만 추출하거나 기본값 사용)
                            const fileName = sidoName + "_" + regionName + "_RealRankus_analysis_" + timestamp + ".png" || 'download_image.png';
                            el.setAttribute('download', fileName);
                        }
                    });
                }
            });
        });
        // --- 다운로드 버튼 추가 끝 ---

        lightbox.init();
        window.pswpLightbox = lightbox;
    };
    </script>

      window.indexedDB.deleteDatabase('202604_03')
      window.indexedDB.deleteDatabase(DB_Date)
     
      const dbName = DB_Date
      var request = indexedDB.open(dbName);

      request.onerror = function (event) {
        // Handle errors.
      };
      request.onupgradeneeded = function (event) {
        var db = event.target.result;
        var objectStore = db.createObjectStore("complex", { keyPath: "index" });                       
        objectStore.transaction.oncomplete = function (event) {          
          // Store values in the newly created objectStore.
          var customerObjectStore = db
            .transaction("complex", "readwrite")
            .objectStore("complex");

          for(var i = 0 ; i < searchingData.length; i++){
            customerObjectStore.add(searchingData[i]);
          }
        };
      };      

      request.onsuccess =(e)=> {        
        var db = request.result;
        const transaction = db.transaction(['complex'], 'readwrite');
      }
    }

      if (endVal > startVal) {

        endVal = $("#pEnd").val();
      }

      priceChartUpdate(

    function priceChartUpdate(
      priceChart,
      sales_history_price,
      sales_history_date,
      sVal,
      eVal
    ) {
      for (var p = 0; p < priceChart.length; p++) {
        sales_grayHistory1 = [];
        sales_pHistory = [];
        sales_grayHistory2 = [];

        sales_pHistory.push(null);
        sales_grayHistory1.push(null);
        sales_grayHistory2.push(null);

        sales_dHistory = [];
        sales_dHistory.push("");

        for (var y = 0; y < sales_history_date.length; y++) {
          if (y < sVal) {
            if (sales_history_price[p][y] == 0) {
              sales_grayHistory1.push(0);
            } else {
              sales_grayHistory1.push(
                (sales_history_price[p][y] / 10000).toFixed(1)
              );
            }
            sales_pHistory.push(null);
            sales_grayHistory2.push(null);
          }
          if (y >= sVal && y <= eVal) {
            sales_grayHistory1.push(null);
            if (sales_history_price[p][y] == 0) {
              sales_pHistory.push(0);
            } else {
              sales_pHistory.push(
                (sales_history_price[p][y] / 10000).toFixed(1)
              );
            }
            sales_grayHistory2.push(null);
          }
          if (y > eVal) {
            sales_grayHistory1.push(null);
            sales_pHistory.push(null);
            if (sales_history_price[p][y] == 0) {
              sales_grayHistory2.push(0);
            } else {
              sales_grayHistory2.push(
                (sales_history_price[p][y] / 10000).toFixed(1)
              );
            }
          }
          //sales_pHistory.push( (sales_history_price[p][y]/10000).toFixed(1) )
          sales_dHistory.push(
            "'" +
              sales_history_date[y].substr(2, 2) +
              "." +
              sales_history_date[y].substr(4, 2)
          );
        }
        sales_pHistory.push(null);
        sales_grayHistory1.push(null);
        sales_grayHistory2.push(null);
        sales_dHistory.push("");

        chartView[p].data.datasets[0].data = sales_grayHistory1;
        chartView[p].data.datasets[1].data = sales_pHistory;
        chartView[p].data.datasets[2].data = sales_grayHistory2;
        chartView[p].update();

        sPrice = sales_history_price[p][sVal];
        ePrice = sales_history_price[p][eVal - 1];
        priceGap = ((ePrice - sPrice) / 10000).toFixed(2);
        priceRatio = ((ePrice / sPrice - 1) * 100).toFixed(1);

        priceChangeText = "";
        priceChangeText +=
          (sPrice / 10000).toFixed(2) +
          " → " +
          (ePrice / 10000).toFixed(2) +
          "억";

        priceRatioText = "";
        if (sPrice == 0) {
          priceRatioText += " ( --- , --- )";
        } else {
          if (priceGap >= 0) {
            priceRatioText += " (+" + priceGap + "억, ";
          } else {
            priceRatioText += " (" + priceGap + "억, ";
          }

          if (priceRatio > 0) {
            priceRatioText +=
              "<span style='color:#fe4040'>▲" + priceRatio + "%</span>)";
          } else if (priceRatio == 0) {
            priceRatioText +=
              "<span style='color:#000'>" + priceRatio + "%</span>)";
          } else {
            priceRatioText +=
              "<span style='color:blue'>▼" + priceRatio * -1 + "%</span>)";
          }
        }
        $("#pChange" + p).html(priceChangeText);
        $("#pRatio" + p).html(priceRatioText);
      }
    }

  function showGraphCarousel(){
      graph_url = "./regional_graph/" + selectedSubRegion + "/graph_list.json";
      basePath = "./regional_graph/" + selectedSubRegion + "/"

      $.getJSON(graph_url, function (json) {
        listData = json;        
      }).done(function(){

        //listData에서 파일명만 추출
        fileList = []
        listData.forEach(item => {
          if(item.endsWith(".png") || item.endsWith(".jpg") || item.endsWith(".jpeg")){
            fileList.push(item);
          }
        });
        console.log("파일 리스트:", fileList);

        const $inner = $('#carouselItems');
        $inner.empty(); // 이전 데이터 삭제

        const $indicators = $('#carouselIndicators');
        $indicators.empty(); // 이전 인디케이터 삭제

        if (fileList.length === 0) {
            alert("표시할 그래프 데이터가 없습니다.");
            return;
        }

        // 1. 파일 리스트를 돌며 Carousel Item 생성
        fileList.forEach((filename, index) => {
            const activeClass = index === 0 ? 'active' : ''; // 첫 번째 아이템에만 active 부여
            const imgUrl = basePath + filename;
            const indicatorHtml = `<button type="button" data-bs-target="#regionCarousel" data-bs-slide-to="${index}" class="${activeClass}" aria-current="${activeClass ? 'true' : 'false'}" aria-label="Slide ${index + 1}"></button>`;
            $('#carouselIndicators').append(indicatorHtml); // 인디케이터 추가
            
            // 1. 반복문 시작 전, $inner 요소(부모)에 갤러리 기준점이 될 클래스를 부여합니다.
            $inner.addClass('my-pswp-gallery-wrapper');            
            const targetAttr = (connectionWebApp === "App") ? "" : ""; // 웹앱 환경 고려 (필요시 조건부 복구)

            // [수정됨] id="my-gallery" 및 불필요한 div 래퍼 제거
            const itemHtml = `
                <div class="carousel-item ${activeClass}">
                    <div class="col-12" style="display: flex; justify-content: center; align-items: center;">
                        <a href="${imgUrl}" 
                          data-pswp-width="1800" 
                          data-pswp-height="1200"
                          class="pswp-trigger-link" ${targetAttr}>
                            <img src="${imgUrl}" class="d-block w-100" alt="${filename}" 
                                style="max-height: 80vh; object-fit: contain;">
                        </a>
                    </div>
                </div>
            `;
            $inner.append(itemHtml);

            // 3. [매우 중요] 반복문이 완전히 종료된 **밖에서** 딱 한 번만 init 실행
            if (typeof window.initPhotoSwipe === 'function') {
                window.initPhotoSwipe();
            }
        });

        // 2. 모달 띄우기
        openModal("graphModal");
        $('#graphModal').css("z-index", "1056"); // 모달의 z-index를 backdrop보다 높게 설정
        $(".modal-backdrop").css({"width" : "100%", "z-index" : "1055"})

        // 3. (선택사항) 모달이 닫힐 때 캐러셀 초기화
        $('#graphModal').on('hidden.bs.modal', function () {
            $inner.empty();
            $indicators.empty();
            $("#baseModal").css({"z-index" : "1055"})
            $(".modal-backdrop").css({"z-index" : "1000", "width" : "600px"})
        });
      })
       .fail(function() {
          console.error("그래프 데이터를 불러오는데 실패했습니다.");
      });
  }
