  function render_currency_bar(data){
    if(!data) return;
    var itemsConfig = [
      { key: "KOSPI", name: "코스피", unit: "", link: "https://www.realrankus.com/moneyflow/#KO_Stock" },
      { key: "KOSDAQ", name: "코스닥", unit: "", link: "https://www.realrankus.com/moneyflow/#KO_Stock" },
      { key: "SNP", name: "S&P500", unit: "", link: "https://www.realrankus.com/moneyflow/#US_Stock" },
      { key: "NAS", name: "나스닥", unit: "", link: "https://www.realrankus.com/moneyflow/#US_Stock" },
      { key: "DOW", name: "다우", unit: "", link: "https://www.realrankus.com/moneyflow/#US_Stock" },
      { key: "USDKRW", name: "달러", unit: "원", link: "https://www.realrankus.com/moneyflow/#Currency" },
      { key: "JPYKRW", name: "100엔", unit: "원", link: "https://www.realrankus.com/moneyflow/#Currency" },
      { key: "EURKRW", name: "유로", unit: "원", link: "https://www.realrankus.com/moneyflow/#Currency" },
      { key: "CNYKRW", name: "위안", unit: "원", link: "https://www.realrankus.com/moneyflow/#Currency" },
      { key: "WTI", name: "WTI유", unit: "$", link: "https://www.realrankus.com/moneyflow/#Oil" },
      { key: "YF_Gold", name: "금", unit: "$", link: "https://www.realrankus.com/moneyflow/#Material" },
      { key: "USDT-BTC", name: "비트코인", unit: "$", link: "https://www.realrankus.com/moneyflow/#Coin" }
    ];

    var groupHtml = "<div class='tickerGroup'>";
    itemsConfig.forEach(function(c){
      var item = data[c.key];
      if(!item) return;

      var valNum = parseFloat(String(item.value).replace(/,/g, ''));
      var rateNum = parseFloat(String(item.rate).replace(/,/g, ''));
      if(isNaN(valNum) || isNaN(rateNum)) return;

      var diffClass = rateNum > 0 ? "currDiffUp" : (rateNum < 0 ? "currDiffDown" : "currDiffSame");
      var rateSign = rateNum > 0 ? "▲ +" : (rateNum < 0 ? "▼ " : "- ");
      var digits = (c.key === "USDT-BTC") ? 1 : 2;
      var formattedVal = valNum.toLocaleString(undefined, { minimumFractionDigits: digits, maximumFractionDigits: digits });

      var valDisplay = "";
      if(c.unit === "$") {
        valDisplay = "$" + formattedVal;
      } else if(c.unit === "원") {
        valDisplay = formattedVal + "원";
      } else {
        valDisplay = formattedVal;
      }

      groupHtml += "<div class='currItem' data-link='" + c.link + "' title='" + c.name + " 상세 차트 바로가기'>";
      groupHtml += "<span class='currLabel'>" + c.name + "</span> ";
      groupHtml += "<span class='currPrice'>" + valDisplay + "</span> ";
      groupHtml += "<span class='" + diffClass + "'>" + rateSign + Math.abs(rateNum).toFixed(2) + "%</span>";
      groupHtml += "</div>";
    });
    groupHtml += "</div>";

    // 3개 그룹을 연속 배치하여 좌우 어느 방향으로 스크롤해도 무한 순환
    var trackHtml = groupHtml + groupHtml + groupHtml;
    $("#currencyTrack").html(trackHtml);

    // 렌더링 후 레이아웃 잡힐 수 있도록 requestAnimationFrame / setTimeout
    setTimeout(initTickerScroll, 50);
  }

  function initTickerScroll(){
    var bar = document.getElementById("currencyBar");
    if(!bar) return;
    var $bar = $(bar);
    var firstGroup = bar.querySelector(".tickerGroup");
    if(!firstGroup) return;

    tickerGroupWidth = firstGroup.offsetWidth;
    if(tickerGroupWidth <= 0){
      setTimeout(initTickerScroll, 100);
      return;
    }

    // 중앙 그룹(Group 1)에서 시작
    bar.scrollLeft = tickerGroupWidth;
    tickerSubpixel = tickerGroupWidth;

    if(tickerAnimId){
      cancelAnimationFrame(tickerAnimId);
      tickerAnimId = null;
    }

    var speed = 0.4167; // 초당 약 25px 이동 (기존 40에서 25로 조정)

    function step(){
      if(!isTickerInteracting && !isTickerHovered && !isTickerDragging){
        tickerSubpixel += speed;
        bar.scrollLeft = tickerSubpixel;

        if(bar.scrollLeft >= tickerGroupWidth * 2){
          bar.scrollLeft -= tickerGroupWidth;
          tickerSubpixel = bar.scrollLeft;
        }
      }
      tickerAnimId = requestAnimationFrame(step);
    }
    tickerAnimId = requestAnimationFrame(step);

    function pauseTicker(){
      isTickerInteracting = true;
      if(tickerResumeTimer){
        clearTimeout(tickerResumeTimer);
      }
    }

    function resumeTickerDelayed(ms){
      if(tickerResumeTimer){
        clearTimeout(tickerResumeTimer);
      }
      tickerResumeTimer = setTimeout(function(){
        isTickerInteracting = false;
        tickerSubpixel = bar.scrollLeft;
      }, ms || 2000);
    }

    function handleLoopWrap(){
      if(tickerGroupWidth <= 0) return;
      if(bar.scrollLeft >= tickerGroupWidth * 2){
        bar.scrollLeft -= tickerGroupWidth;
        tickerSubpixel = bar.scrollLeft;
      } else if(bar.scrollLeft <= 0){
        bar.scrollLeft += tickerGroupWidth;
        tickerSubpixel = bar.scrollLeft;
      }
    }

    // 마우스 드래그 (데스크톱)
    var startX = 0;
    var startScrollLeft = 0;
    var hasMoved = false;
    var isPointerDown = false;

    $bar.off('.ticker');
    $(window).off('.tickerWindow');

    $bar.on('mousedown.ticker', function(e){
      if(e.button !== 0) return;
      isPointerDown = true;
      hasMoved = false;
      startX = e.pageX;
      startScrollLeft = bar.scrollLeft;
      pauseTicker();
    });

    $(window).on('mousemove.tickerWindow', function(e){
      if(!isPointerDown) return;
      var dx = e.pageX - startX;
      if(Math.abs(dx) > 4){
        hasMoved = true;
        isTickerDragging = true;
      }
      bar.scrollLeft = startScrollLeft - dx;
      tickerSubpixel = bar.scrollLeft;
      handleLoopWrap();
    });

    $(window).on('mouseup.tickerWindow', function(){
      if(!isPointerDown) return;
      isPointerDown = false;
      setTimeout(function(){
        isTickerDragging = false;
      }, 50);
      resumeTickerDelayed(2000);
    });

    // 터치 스와이프 (모바일)
    $bar.on('touchstart.ticker', function(e){
      pauseTicker();
      hasMoved = false;
      if(e.originalEvent && e.originalEvent.touches && e.originalEvent.touches.length > 0){
        startX = e.originalEvent.touches[0].pageX;
      }
    });

    $bar.on('touchmove.ticker', function(e){
      pauseTicker();
      if(e.originalEvent && e.originalEvent.touches && e.originalEvent.touches.length > 0){
        if(Math.abs(e.originalEvent.touches[0].pageX - startX) > 6){
          hasMoved = true;
          isTickerDragging = true;
        }
      }
    });

    $bar.on('touchend.ticker touchcancel.ticker', function(){
      setTimeout(function(){
        isTickerDragging = false;
      }, 100);
      resumeTickerDelayed(2000);
    });

    // 네이티브 스크롤 (휠, 트랙패드, 모바일 관성)
    $bar.on('scroll.ticker', function(){
      tickerSubpixel = bar.scrollLeft;
      handleLoopWrap();
      if(isTickerInteracting){
        resumeTickerDelayed(2000);
      }
    });

    // 데스크톱 호버 시 일시 정지
    $bar.on('mouseenter.ticker', function(){
      isTickerHovered = true;
    });

    $bar.on('mouseleave.ticker', function(){
      isTickerHovered = false;
    });

    // 클릭 시 MoneyFlow 차트 이동 (드래그 중에는 클릭 방지)
    $bar.on('click.ticker', '.currItem', function(e){
      if(hasMoved || isTickerDragging){
        e.preventDefault();
        return;
      }
      var link = $(this).attr('data-link');
      if(link){
        openOuterLink(link);
      }
    });

    // 화면 크기 변경 시 폭 재계산
    $(window).on('resize.tickerWindow', function(){
      if(firstGroup && firstGroup.offsetWidth > 0){
        tickerGroupWidth = firstGroup.offsetWidth;
      }
    });
  }

function dateFormat(date) {
  fDate = new Date(date)
  let month = fDate.getMonth() + 1;
  let day = fDate.getDate();
  let hour = fDate.getHours();
  let minute = fDate.getMinutes();
  let second = fDate.getSeconds();

  month = month >= 10 ? month : '0' + month;
  day = day >= 10 ? day : '0' + day;
  hour = hour >= 10 ? hour : '0' + hour;
  minute = minute >= 10 ? minute : '0' + minute;
  second = second >= 10 ? second : '0' + second;

  return fDate.getFullYear() + '-' + month + '-' + day + ' ' + hour + ':' + minute;
}
